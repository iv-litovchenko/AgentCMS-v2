parameters:
    app.version: '0.0.1'
    app.cms_site_title: '%env(default:app_cms_site_title_default:CMS_SITE_TITLE)%'
    app_cms_site_title_default: 'Agent CMS'
    app.workspaces_dir: '%env(default:app_workspaces_dir_default:WORKSPACES_DIR)%'
    app_workspaces_dir_default: '%kernel.project_dir%/../../workspaces'
    app.ui_menu_config: '%kernel.project_dir%/resources/cms/ui/menu.yaml'
    app.ui_asset_packages_registry: '%kernel.project_dir%/resources/cms/ui/asset-packages.yaml'
    app.ui_asset_toggles_file: '%kernel.project_dir%/var/ui/asset-toggles.yaml'
    app.footer_quotes_registry: '%kernel.project_dir%/resources/cms/ui/footer-quotes.yaml'
    app.header_quotes_registry: '%kernel.project_dir%/resources/cms/ui/header-quotes.yaml'
    app.starter_packages_registry: '%kernel.project_dir%/resources/cms/starter/packages.yaml'
    app.starter_cli_tools_registry: '%kernel.project_dir%/resources/cms/starter/cli_tools.yaml'
    app.starter_toggles_file: '%kernel.project_dir%/var/starter/toggles.yaml'
    app.starter_env_registry: '%kernel.project_dir%/resources/cms/starter/env.registry.yaml'
    app.starter_env_values_file: '%kernel.project_dir%/var/starter/env.yaml'
    app.starter_mounts_registry: '%kernel.project_dir%/resources/cms/starter/mounts.registry.yaml'
    app.starter_mounts_file: '%kernel.project_dir%/var/starter/mounts.yaml'
    app.connector_registry: '%kernel.project_dir%/resources/cms/connector/tokens.registry.yaml'
    app.connector_tokens_file: '%kernel.project_dir%/var/connector/tokens.yaml'
    app.project_root: '%kernel.project_dir%/../..'
    app.maintenance_mode_file: '%env(default:app_maintenance_mode_file_default:MAINTENANCE_MODE_FILE)%'
    app_maintenance_mode_file_default: '%app.project_root%/var/cli/maintenance-mode'
    app.cms_log_file: '%kernel.logs_dir%/cms.log'
    app.starter_log_max_lines: 80
    app.starter_log_max_bytes: 65536
    app.project_readme_default: '%kernel.project_dir%/../../README.md'
    app.project_readme: '%env(default:app.project_readme_default:PROJECT_README_PATH)%'
    app.public_base_domain: '%env(default:app_public_base_domain_default:PUBLIC_BASE_DOMAIN)%'
    app_public_base_domain_default: 'localhost'
    app.public_http_port: '%env(default:app_public_http_port_default:PUBLIC_HTTP_PORT)%'
    app_public_http_port_default: '8080'
    app.public_https_port: '%env(default:app_public_https_port_default:PUBLIC_HTTPS_PORT)%'
    app_public_https_port_default: '8443'
    app.public_preferred_scheme: '%env(default:app_public_preferred_scheme_default:PUBLIC_PREFERRED_SCHEME)%'
    app_public_preferred_scheme_default: 'https'
    app.redirect_http_to_https: '%env(bool:default:app_redirect_http_to_https_default:REDIRECT_HTTP_TO_HTTPS)%'
    app_redirect_http_to_https_default: true

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\EventSubscriber\MaintenanceModeSubscriber:
        arguments:
            $maintenanceModeFile: '%app.maintenance_mode_file%'

    App\Service\WorkspaceService:
        arguments:
            $workspacesDir: '%app.workspaces_dir%'

    App\Service\UiAssetPackageService:
        arguments:
            $registryPath: '%app.ui_asset_packages_registry%'
            $togglesFilePath: '%app.ui_asset_toggles_file%'

    App\Service\UiMenuService:
        arguments:
            $uiMenuConfigPath: '%app.ui_menu_config%'
            $publicBaseDomain: '%app.public_base_domain%'
            $publicHttpPort: '%app.public_http_port%'
            $publicHttpsPort: '%app.public_https_port%'
            $publicPreferredScheme: '%app.public_preferred_scheme%'

    App\Service\FooterQuoteService:
        arguments:
            $registryPath: '%app.footer_quotes_registry%'

    App\Service\HeaderQuoteService:
        arguments:
            $registryPath: '%app.header_quotes_registry%'

    App\Service\StarterEnvironmentService:
        arguments:
            $appVersion: '%app.version%'
            $cliToolsRegistryPath: '%app.starter_cli_tools_registry%'

    App\Service\StarterToggleService:
        arguments:
            $packagesRegistryPath: '%app.starter_packages_registry%'
            $menuConfigPath: '%app.ui_menu_config%'
            $togglesFilePath: '%app.starter_toggles_file%'

    App\Service\StarterEnvService:
        arguments:
            $registryPath: '%app.starter_env_registry%'
            $valuesFilePath: '%app.starter_env_values_file%'

    App\EventSubscriber\HttpsRedirectSubscriber:
        arguments:
            $redirectHttpToHttps: '%app.redirect_http_to_https%'
            $publicHttpsPort: '%app.public_https_port%'

    App\Service\StarterMountService:
        arguments:
            $registryPath: '%app.starter_mounts_registry%'
            $mountsFilePath: '%app.starter_mounts_file%'
            $projectRoot: '%app.project_root%'

    App\Service\ConnectorService:
        arguments:
            $registryPath: '%app.connector_registry%'
            $tokensFilePath: '%app.connector_tokens_file%'
            $publicBaseDomain: '%app.public_base_domain%'
            $publicHttpPort: '%app.public_http_port%'
            $publicHttpsPort: '%app.public_https_port%'

    App\Service\CmsFileLogger:
        arguments:
            $logFilePath: '%app.cms_log_file%'

    App\Service\StarterLogJournalService:
        arguments:
            $logDirectory: '%kernel.logs_dir%'
            $maxLines: '%app.starter_log_max_lines%'
            $maxBytesPerFile: '%app.starter_log_max_bytes%'

    App\Service\ProjectReadmeService:
        arguments:
            $readmePath: '%app.project_readme%'
