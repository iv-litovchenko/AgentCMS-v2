# UI: зоны меню. route — имя маршрута Symfony; active_routes — подсветка пункта.
# apps — /app/{name} и /app/{name}/{section}

profile:
  display_name: Администратор
  email: user@cms.local
  initials: А

apps:
  items:
    - label: Документация
      name: documentation
      sections:
        - label: README
          slug: readme
        - label: Хорошие практики
          slug: practices
        - label: API
          slug: api
        - label: MCP
          slug: mcp
        - label: SKILLS
          slug: skills
        - label: Макеты
          slug: layouts
        - label: Типография
          slug: typography
    - label: Коннектор
      name: connector
      hide_apps_nav: true
    - label: Стартер
      name: starter
      hide_apps_nav: true
    - label: Чат
      name: chat
      hide_apps_nav: true
    - label: Окна
      name: windows
      hide_apps_nav: true
    - label: Командер
      name: commander
      hide_apps_nav: true
    - label: Symfony AI
      name: symfony_ai
      hide_apps_nav: true

# Сервисы на поддоменах: {subdomain}.{PUBLIC_BASE_DOMAIN}
services:
  items:
    - label: QwenPaw
      id: qwenpaw
      subdomain: qwenpaw
      compose_service: qwenpaw
      default_enabled: true
      description: Отдельный сервис на поддомене qwenpaw (stub)

zones:
  main:
    items: []

  profile_dropdown:
    items:
      - label: Профиль
        enabled: false
      - label: Настройки
        enabled: false
      - divider: true
      - label: Выйти
        enabled: false
