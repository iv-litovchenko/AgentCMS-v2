name: Факт
status: active
extends: content/_base
description: 'Атомарный факт в банке awn-facts/ — решение, предпочтение, сущность'
fields:
  awn-fact-kind:
    type: fields/choice/one
    title: '{A2!} Вид факта'
    placement: aside-body
    group: content
    sort: 10
    enum:
      -
        key: viz/decision
        name: Решение
      -
        key: preference
        name: Предпочтение
      -
        key: entity
        name: Сущность
      -
        key: procedure
        name: Процедура
      -
        key: open-question
        name: 'Открытый вопрос'
      -
        key: note
        name: Заметка
      -
        key: fact
        name: Факт
  awn-source:
    type: fields/choice/one
    title: '{A2!} Источник'
    placement: aside-body
    group: content
    sort: 11
    enum:
      -
        key: claude-desktop
        name: 'Claude Desktop'
      -
        key: cursor
        name: Cursor
      -
        key: voice
        name: 'Voice / Shell'
      -
        key: shell
        name: Shell
      -
        key: codex
        name: Codex
      -
        key: manual
        name: Вручную
      -
        key: other
        name: Другое
  awn-source-ref:
    type: fields/string
    title: '{A2!} Ссылка на источник'
    description: 'Путь к дискуссии или записи (awn-dialogs/…, discussion/…)'
    placement: aside-body
    group: content
    sort: 12
  awn-supersedes:
    type: fields/string
    title: '{A2!} Заменяет'
    description: 'Путь или id более старого факта'
    placement: aside-body
    group: content
    sort: 13
