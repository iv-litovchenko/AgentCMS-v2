name: 'Правило триггера'
extends: fields/object
status: draft
description: |
  Крючок workspace: событие → условие (опционально) → действие. Примеры действий: webhook, notify_user, run_script, вызов MCP-tool. Runtime-исполнитель — позже; тип зарезервирован под редактор правил.
widget: json
storage: object
mdbase: object
settings:
  - hint
  - required
  - locked
group: automation
sort: 1
properties:
  id:
    type: fields/string/slug
    title: 'ID правила'
  title:
    type: fields/string
    title: Название
  enabled:
    type: fields/boolean
    title: Включено
    default: true
  event:
    type: fields/choice/one
    title: Событие
    description: 'Что отслеживать в workspace'
    enum:
      - file.saved
      - page.created
      - index.pipeline.done
      - workspace.cron
      - agent.session.end
  filter:
    type: fields/string
    title: Условие
    description: 'Опционально: путь, тип записи, тег (позже — выражение)'
  action:
    type: fields/choice/one
    title: Действие
    enum:
      - webhook.post
      - notify.user
      - run.script
      - mcp.tool
  target:
    type: fields/string
    title: 'Куда / что вызвать'
    description: 'URL webhook, id скрипта, имя MCP-tool и т.д.'
