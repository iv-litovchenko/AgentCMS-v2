name: Репозиторий
status: active
hub: repository
extends: sections/_base
tree-ui:
  icon: code
  icon-class: text-orange-600
description: |
  Карточка в acms-repositories/{slug}/ — manifest и readme в индексе; git clone — 0-source/; память CMS — 0-storage/ (flexible, todo, state). Subtree 0-source по умолчанию не в поиске.
storage-slots:
  - flexible
  - source
  - sessions
  - todo
  - state
form:
  panel-title: '{A2!} Репозиторий'
  create:
    title: 'Новый репозиторий'
    edit-title: Репозиторий
    adopt-title: 'Подхватить репозиторий'
    hint: |
      manifest.section.md; клон — 0-source/; заметки и файлы CMS — 0-storage/ (гибкий слот).
    bootstrap:
      slug:
        title: 'Папка (slug)'
        placeholder: voice-shell-fork
        footnote: 'kebab-case, одна папка — без /'
        required: true
    field-keys:
      - awn-name
      - awn-description
      - awn-repo-origin
      - awn-repository-group
      - awn-repo-tech
      - awn-repo-related-topic
      - awn-index-exclude-subtree
field-groups:
  -
    id: repository
    name: '{A2!} Репозиторий'
    description: 'Git-источник и группа в sidebar'
    collapsed: false
  -
    id: indexing
    name: '{A2!} Индексирование'
    description: 'Что попадает в поиск vault'
    collapsed: true
fields:
  awn-slots-flexible:
    hidden: true
  awn-main:
    hidden: true
  awn-focus:
    hidden: true
  awn-index-exclude-record:
    hidden: true
  awn-name:
    title: Название
  awn-description:
    title: Описание
  awn-repo-origin:
    type: fields/string/url
    title: 'Git origin'
    description: 'URL удалённого репозитория (https://github.com/…)'
    placeholder: 'https://github.com/org/repo'
    placement: aside-body
    group: repository
    sort: 1
  awn-repository-group:
    type: fields/string
    title: Группа
    description: 'Логическая группа из awn-repositories/groups.yml (без подпапок)'
    placement: aside-body
    group: repository
    sort: 2
  awn-repo-tech:
    type: fields/string
    title: 'Стек / теги'
    description: 'Технологии и метки через запятую (React, Python, fork…)'
    placeholder: 'react, typescript, fork'
    placement: aside-body
    group: repository
    sort: 3
  awn-repo-related-topic:
    type: fields/string
    title: 'Связанная тема'
    description: 'Путь manifest.md темы CMS, к которой привязан репозиторий'
    placeholder: awn-container/moya-tema/manifest.md
    placement: aside-body
    group: repository
    sort: 4
  awn-index-exclude-subtree:
    default: true
    title: 'Запретить индексирование содержимого'
    description: |
      Не индексировать файлы внутри папки репозитория. manifest.md и readme.md (любой регистр) остаются в индексе.
