name: 'Коллекция (записи на базе MD-файлов)'
status: active
sort: 20
hub: database
extends: sections/database/_base
description: 'Записи в 0-storage/data/ — полные md-файлы с frontmatter'
storage-slots:
  - data
  - assets
  - todo
  - state
  - sessions
tree-ui:
  icon: database
  icon-class: text-violet-600
kind-ui:
  for: collection-md
  label: 'Коллекция (записи на базе MD-файлов)'
  badge:
    background: '#f5f3ff'
    border: '#ddd6fe'
    text: '#5b21b6'
fields:
  awn-collection-type:
    default: md
    locked: true
  awn-record-hierarchy:
    type: fields/boolean
    title: '{A2!} Поддержка разделов'
    description: 'Для md, csv-files и files; не для единой csv-таблицы main.csv'
    placement: aside-body
    group: infoblock
    sort: 4
    default: false
  awn-record-file-types:
    type: fields/string
    title: '{A2!} Типы файлов'
    description: 'Только для files: image/*,.pdf,.md'
    placement: aside-body
    group: infoblock
    sort: 5
    default: ''