name: Канал
status: active
hub: channel
extends: nodes/_base
tree-ui:
  icon: channel
  icon-class: text-indigo-600
description: |
  Карточка канала в awn-channels/{slug}/ — manifest.md и 0-storage/: inbox/ (ingress), task-queue/ (очередь задач), outbox/ (исходящие), files/ и assets/ (как у медиатеки). Triage сырого потока до тем и инфоблоков.
storage-slots:
  - inbox
  - task-queue
  - outbox
  - files
  - assets
form:
  panel-title: '{A2!} Канал'
  create:
    title: 'Новый канал'
    edit-title: Канал
    hint: |
      Папка awn-channels/{slug}/ с manifest.md; слоты 0-storage/ — по кнопке «Создать слот» в карточке узла.
    bootstrap:
      slug:
        title: 'Папка (slug)'
        placeholder: telegram
        footnote: 'kebab-case, одна папка — без /'
        required: true
    field-keys:
      - awn-name
      - awn-description
