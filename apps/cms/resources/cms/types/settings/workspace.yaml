name: 'Настройки workspace'
status: active
extends: settings/_base
description: |
  Параметры конкретного хранилища (workspace): агент, слоты, TTL, счётчик awn-id. Значения — .agent-cms/settings/workspace.yml. Отдельная область, не сливается с platform/user.
scope: workspace
enabled: true
consumer:
  - mcp-server
  - server
  - ui
  - context
valuesFile: .agent-cms/settings/workspace.yml
fieldGroups:
  -
    id: general
    name: Общие
    description: |
      Язык агента и уведомления для этого хранилища (.agent-cms/settings/workspace.yml).
  -
    id: agent
    name: Агент
    description: 'Параметры агента для этого хранилища (settings.yml).'
  -
    id: autoincrement
    name: Автоинкремент
    description: |
      Глобальный счётчик awn-id для записей workspace (только просмотр в UI). Значения в settings.yml; обновляются при присвоении id и sync-counter.
  -
    id: registry-queries
    name: 'Реестр запросов'
    description: |
      Именованные выборки для агента: SQL-like по storage-index (поля frontmatter) или готовые runtime-сборки (cron, heartbeat). Файл .agent-cms/settings/registry-queries.yml. MCP list_workspace_registry_queries · run_workspace_registry_query.
  -
    id: memory
    name: Память
    description: 'Слоты и TTL временных данных workspace (пока не подключены в runtime).'
  -
    id: hooks
    name: 'Крючки и триггеры'
    description: |
      Правила «когда в хранилище происходит событие — выполнить действие»: webhook, уведомление, скрипт или вызов MCP. Список правил будет здесь; исполнитель в runtime — позже. Сейчас раздел-заглушка.
  -
    id: voice-client
    name: 'Голосовой клиент'
    description: |
      Настройки Agent CMS Voice для этого workspace. Секреты API — в .env; живая сессия Shell — в .agent-cms/state/shell.json.
    subgroups:
      -
        id: voice-cms
        name: 'CMS и канал'
        description: 'Привязка Voice к теме workspace'
        sort: 1
        defaultOpen: true
      -
        id: voice-input
        name: 'Ввод (микрофон)'
        description: 'Режим 🎤 у поля ввода и доп. опции'
        sort: 2
      -
        id: voice-route
        name: 'Маршрут и агент'
        description: 'Runtime по умолчанию и system prompt'
        sort: 3
        defaultOpen: true
      -
        id: voice-route-claude
        name: 'Маршрут · Claude CLI'
        description: |
          Локальный CLI Claude. Shell запускает claude в workspaces/0-cli-sandbox/claude/<agent-id>/ — не в корне workspace. К CMS — через MCP.
          Установка npm i -g @anthropic-ai/claude-code · claude login · claude auth status.
        sort: 4
      -
        id: voice-route-codex
        name: 'Маршрут · Codex CLI'
        description: |
          Локальный CLI Codex. Shell запускает codex exec в workspaces/0-cli-sandbox/codex/<agent-id>/ — хранилище CMS не монтируется.
          Установка npm i -g @openai/codex · codex login · codex --version.
        sort: 5
      -
        id: voice-route-cursor
        name: 'Маршрут · Cursor'
        description: 'Cursor Agent — OpenAI-compatible endpoint (скоро)'
        disabled: true
        sort: 6
      -
        id: voice-route-openclaw
        name: 'Маршрут · OpenClaw'
        description: 'OpenClaw Gateway — локальный агент :18789 (скоро)'
        disabled: true
        sort: 7
      -
        id: voice-route-hermes
        name: 'Маршрут · Hermes Agent'
        description: 'Hermes Agent (Nous Research) — API :8642/v1 (скоро)'
        disabled: true
        sort: 8
      -
        id: voice-route-agent-zero
        name: 'Маршрут · Agent Zero'
        description: 'Agent Zero gateway — :42617 (скоро)'
        disabled: true
        sort: 9
      -
        id: voice-route-qwenpaw
        name: 'Маршрут · QwenPaw'
        description: |
          HTTP-агент QwenPaw. Shell отправляет сообщения на сервер и стримит ответ через SSE.
          URL, agentId и session — в полях ниже.
        sort: 10
      -
        id: voice-stt
        name: 'Распознавание (STT)'
        description: 'Включение, захват, промпт и движок'
        sort: 11
        defaultOpen: true
      -
        id: voice-stt-browser
        name: 'Распознавание (STT) · Web Speech'
        sort: 12
      -
        id: voice-stt-whisper
        name: 'Распознавание (STT) · Whisper'
        description: 'Локальный Whisper на сервере (скоро в Voice Shell)'
        disabled: true
        sort: 13
      -
        id: voice-stt-elevenlabs
        name: 'Распознавание (STT) · ElevenLabs Scribe'
        description: 'Облачный Scribe (скоро в Voice Shell)'
        disabled: true
        sort: 14
      -
        id: voice-tts
        name: 'Озвучка (TTS)'
        description: 'Включение, способ озвучки, промпт и активный движок'
        sort: 15
        defaultOpen: true
      -
        id: voice-tts-browser
        name: 'Озвучка (TTS) · Web Speech'
        sort: 16
      -
        id: voice-tts-edge
        name: 'Озвучка (TTS) · Edge TTS'
        sort: 17
      -
        id: voice-tts-piper
        name: 'Озвучка (TTS) · Piper'
        description: 'Локальный Piper на сервере (скоро в Voice Shell)'
        disabled: true
        sort: 18
      -
        id: voice-tts-elevenlabs
        name: 'Озвучка (TTS) · ElevenLabs'
        sort: 19
      -
        id: voice-proactive
        name: 'Проактивные пинги'
        sort: 20
      -
        id: voice-media
        name: 'Камера и экран'
        sort: 21
      -
        id: voice-window
        name: 'Окно Voice'
        description: 'Оформление окна Voice Shell — персонаж, компактный режим, фон, звук.'
        sort: 22
        defaultOpen: true
      -
        id: voice-ui
        name: 'Интерфейс диалога'
        sort: 23
      -
        id: voice-compose
        name: 'Шаблоны compose'
        description: 'Быстрые команды для поля сообщения в Voice Shell'
        sort: 24
      -
        id: voice-file-hub
        name: Файлообменник
        description: |
          Очередь выдачи файлов из хранилища в Voice Shell и Companion (📎 на вкладку).
        sort: 25
  -
    id: dependencies
    name: Зависимости
    description: |
      Файл dependencies.csv в корне workspace и схема колонок для агента. Строки — в CSV; набор колонок — здесь (readonly path + описания полей).
  -
    id: static
    name: 'Статичные параметры'
    description: |
      Заглушка для интеграций — внешние плагины, Cursor skills и сторонние сервисы (settings.yml).
    subgroups:
      -
        id: demo-plugin
        name: demo-plugin
        description: 'Заглушка внешнего плагина'
        sort: 1
        defaultOpen: true
      -
        id: examples
        name: Примеры
        description: 'Тестовые ключи для схемы'
        sort: 2
fields:
  agent-language:
    type: fields/choice/one
    title: '{NOT WORK} Язык агента'
    description: 'Предпочтительный язык ответов для этого хранилища'
    default: ru
    enum:
      - ru
      - en
      - auto
    group: general
    sort: 10
  response-style:
    type: fields/choice/one
    title: '{NOT WORK} Стиль ответов'
    description: 'Кратко / подробно / как в AGENTS.md'
    default: agents-md
    enum:
      - brief
      - detailed
      - agents-md
    group: general
    sort: 11
  notify-on-complete:
    type: fields/boolean
    title: '{NOT WORK} Уведомление по завершении'
    description: 'notify_user после длинных задач в этом workspace'
    default: false
    group: general
    sort: 12
  workspace-idle-screensaver-minutes:
    type: fields/choice/one
    title: 'Заставка при бездействии'
    description: |
      Полноэкранная заставка, если вы не взаимодействуете с этим хранилищем. «Выключено» — таймер не запускается (один отложенный таймер в браузере, без опроса).
    default: '3'
    enum:
      -
        key: 'off'
        name: Выключено
      -
        key: '3'
        name: '3 минуты'
      -
        key: '5'
        name: '5 минут'
      -
        key: '10'
        name: '10 минут'
      -
        key: '30'
        name: '30 минут'
    group: general
    sort: 13
  workspace-pomodoro-enabled:
    type: fields/boolean
    title: 'Метод помидора'
    description: |
      Кнопка 🍅 в футере: интервал фокуса, звуковой сигнал и окно короткого отдыха. Не связано с заставкой при бездействии. Выключите, если таймер не нужен.
    default: true
    group: general
    sort: 14
  workspace-pomodoro-work-minutes:
    type: fields/choice/one
    title: 'Интервал помидора'
    description: 'Длительность фокуса до звонка и перерыва (кнопка 🍅 в футере).'
    default: '25'
    enum:
      -
        key: '1'
        name: '1 минута'
      -
        key: '5'
        name: '5 минут'
      -
        key: '25'
        name: '25 минут'
      -
        key: '45'
        name: '45 минут'
      -
        key: '60'
        name: '60 минут'
    group: general
    sort: 15
  workspace-pomodoro-break-minutes:
    type: fields/choice/one
    title: 'Перерыв помидора'
    description: 'Длительность отдыха после фокуса (таймер в окне «Время отдохнуть»).'
    default: '5'
    enum:
      -
        key: '5'
        name: '5 минут'
      -
        key: '10'
        name: '10 минут'
      -
        key: '15'
        name: '15 минут'
      -
        key: '60'
        name: '60 минут'
    group: general
    sort: 16
  awn-id-next:
    type: fields/number/integer
    title: 'Следующий id'
    description: 'Следующий номер для присвоения awn-id новым записям'
    locked: true
    default: 1
    group: autoincrement
    sort: 20
  awn-id-issued:
    type: fields/number/integer
    title: 'Выдано id'
    description: 'Сколько awn-id уже выдано счётчиком'
    locked: true
    default: 0
    group: autoincrement
    sort: 21
  awn-id-updated-at:
    type: fields/string
    title: Обновлено
    description: 'Время последнего изменения счётчика (ISO 8601)'
    locked: true
    group: autoincrement
    sort: 22
  awn-id-model:
    type: fields/string
    title: 'Модель счётчика'
    description: 'Версия схемы счётчика awn-id'
    locked: true
    default: workspace-id-autoincrement-v1
    group: autoincrement
    sort: 23
  awn-recycle-id-next:
    type: fields/number/integer
    title: 'Следующая метка удаления'
    description: 'Следующий номер для мягкого удаления (корзина awn-recycler)'
    locked: true
    default: 1
    group: autoincrement
    sort: 24
  awn-recycle-id-issued:
    type: fields/number/integer
    title: 'Выдано меток удаления'
    description: 'Сколько меток удаления уже выдано счётчиком'
    locked: true
    default: 0
    group: autoincrement
    sort: 25
  awn-recycle-id-updated-at:
    type: fields/string
    title: 'Метки удаления — обновлено'
    description: 'Время последнего изменения счётчика меток (ISO 8601)'
    locked: true
    group: autoincrement
    sort: 26
  awn-recycle-id-model:
    type: fields/string
    title: 'Модель меток удаления'
    description: 'Версия схемы счётчика меток корзины'
    locked: true
    default: workspace-recycle-marker-v1
    group: autoincrement
    sort: 27
  awn-recycle-id-pad-width:
    type: fields/number/integer
    title: 'Ширина метки (ведущие нули)'
    description: 'Длина числовой метки в имени re-… и .trash.… (4–12)'
    locked: true
    default: 8
    group: autoincrement
    sort: 28
  registry-queries-lead:
    type: fields/text
    title: 'Как это работает'
    description: 'Концепция раздела'
    readonly: true
    group: registry-queries
    sort: 5
    default: |
      Именованные выборки по индексу полей (как «Поля SQL-like»).
      У каждого шаблона: id, название, фильтр where/fields/limit.
      MCP: run_workspace_registry_query({ id: "cron" }). Свои шаблоны — кнопка «+».
  registry-queries-filter-example:
    type: fields/text/code
    title: 'Пример запроса (фильтр)'
    description: 'Скопируйте в свой шаблон и измените поля. Индекс — «Поля (SQL-like)».'
    readonly: true
    group: registry-queries
    sort: 8
    default: |
      # Ограничить поддерево workspace (папка темы, контейнер, awn-databases/…)
      pathPrefix: awn-container/moya-tema
      # Условия (все строки where — AND). Поля — как в YAML-frontmatter записей.
      where:
        - field: awn-runtime-cron
          eq: true
        # - field: awn-tags
        #   contains: важное
        # - field: awn-id
        #   gte: 100
      fields:
        - path
        - awn-name
        - awn-description
      sort:
        field: path
        dir: asc
      limit: 100
      # Окно по дате (пересчёт при run): relativeDays: 7, relativeDaysField: awn-create
      # (по умолчанию relativeDaysField — awn-update, «изменены за N дней»)
      # Фиксированная дата без relativeDays:
      # where:
      #   - field: awn-create
      #     gte: "2026-10-01T00:00:00.000Z"
  registry-query-presets:
    type: fields/repeater
    title: 'Шаблоны реестров'
    description: |
      Встроенные шаблоны (только просмотр). Изменение — в .agent-cms/settings/registry-queries.yml или через MCP list_workspace_registry_queries / run_workspace_registry_query.
    readonly: true
    locked: true
    group: registry-queries
    sort: 10
    properties:
      id:
        type: fields/string/slug
        title: ID
        description: 'cron, heartbeat, always-context, nav-focus, …'
      name:
        type: fields/string
        title: Название
      about:
        type: fields/text
        title: Описание
        hint: 'Для агента и подсказок в UI — что возвращает выборка (в registry-queries.yml — ключ comment)'
      query:
        type: fields/text/code
        title: 'Запрос (фильтр)'
        description: |
          Фильтр по каталогу полей workspace (storage-index). Ключи where: field + eq | contains | gte | lte | gt | lt.
          pathPrefix в корне — только файлы под этой папкой (без ведущего /).
        hint: 'where: [{ field, eq|contains… }], fields: [path, …], sort, limit'
        default: |
          where:
            - field: awn-type
              eq: awn.page.topic
          fields:
            - path
            - awn-name
          limit: 50
  default-slot:
    type: fields/string
    title: '{NOT WORK} Слот по умолчанию'
    default: main
    group: memory
    sort: 30
  awn-temp-ttl-days:
    type: fields/number/integer
    title: '{NOT WORK} TTL awn-temp (дни)'
    default: 0
    group: memory
    sort: 31
  hooks-stub-plan:
    type: fields/text
    title: 'Как это будет работать'
    description: 'Концепция раздела (только просмотр, пока не исполняется)'
    readonly: true
    group: hooks
    sort: 40
    default: |
      1. Событие — file.saved, index.pipeline.done, cron, конец сессии агента…
      2. Условие — путь, тип записи, тег (опционально).
      3. Действие — POST на URL, notify_user, run_script, mcp.tool.

      Правила хранятся в settings.yml (или отдельном awn-databases). Подписка — в server/MCP.
  hooks-rules:
    type: fields/repeater
    title: '{NOT WORK} Правила'
    description: 'Список крючков workspace — редактор и runtime позже'
    locked: true
    group: hooks
    sort: 41
    items: fields/trigger/rule
  voice-route-runtime:
    type: fields/choice/one
    title: 'Runtime по умолчанию'
    description: 'Дефолтный runtime при открытии Shell. В шапке можно выбрать другой на время сессии.'
    default: codex
    enum:
      -
        key: claude
        name: 'Claude CLI (Anthropic)'
      -
        key: codex
        name: 'Codex CLI (OpenAI)'
      -
        key: cursor
        name: 'Cursor (Anysphere) — скоро'
      -
        key: openclaw
        name: 'OpenClaw — скоро'
      -
        key: hermes
        name: 'Hermes Agent — скоро'
      -
        key: agent-zero
        name: 'Agent Zero — скоро'
      -
        key: qwenpaw
        name: 'QwenPaw (AgentScope)'
    group: voice-client
    subgroup: voice-cms
    sort: 49
  voice-cms-topic-path:
    type: fields/string
    title: 'Тема агента (manifest)'
    description: 'Путь к manifest темы для Voice Shell (cms.topicPath)'
    default: awn-topics/0-agent-kit/0-agent/manifest.md
    readonly: true
    group: voice-client
    subgroup: voice-cms
    sort: 50
  voice-cms-channel:
    type: fields/choice/one
    title: 'Канал диалога'
    description: 'Канал сообщений Voice Shell (thread или session)'
    default: thread
    readonly: true
    enum:
      -
        key: thread
        name: thread
      -
        key: session
        name: session
    group: voice-client
    subgroup: voice-cms
    sort: 51
  voice-route-system-prompt:
    type: fields/text
    title: 'System prompt Voice'
    description: 'Доп. system prompt для Voice Shell'
    group: voice-client
    subgroup: voice-route
    sort: 53
  voice-route-claude-cli-path:
    type: fields/string
    title: 'Путь к Claude CLI'
    description: 'Команда или путь к исполняемому файлу Claude CLI.'
    default: claude
    group: voice-client
    subgroup: voice-route-claude
    sort: 60
  voice-route-claude-model:
    type: fields/string
    title: 'Модель Claude'
    description: 'Модель Claude. Пусто — значение по умолчанию из CLI.'
    group: voice-client
    subgroup: voice-route-claude
    sort: 61
  voice-route-claude-session-id:
    type: fields/string
    title: 'Session ID'
    description: 'Привязка к сессии Claude CLI (--resume). Пусто — новая сессия.'
    group: voice-client
    subgroup: voice-route-claude
    sort: 62
  voice-route-claude-permission-mode:
    type: fields/choice/one
    title: 'Подтверждение инструментов'
    description: 'Как Claude CLI запрашивает подтверждение вызова инструментов.'
    default: ''
    enum:
      -
        key: ''
        name: 'Спрашивать (модалка)'
      -
        key: manual
        name: Manual
      -
        key: plan
        name: Plan
      -
        key: auto
        name: Auto
      -
        key: dontAsk
        name: "Don't ask"
      -
        key: bypassPermissions
        name: Bypass
    group: voice-client
    subgroup: voice-route-claude
    sort: 63
  voice-route-codex-cli-path:
    type: fields/string
    title: 'Путь к Codex CLI'
    description: 'Команда или путь к исполняемому файлу Codex CLI.'
    default: codex
    group: voice-client
    subgroup: voice-route-codex
    sort: 70
  voice-route-codex-model:
    type: fields/string
    title: 'Модель Codex'
    description: 'Модель Codex. Пусто — значение по умолчанию из CLI.'
    group: voice-client
    subgroup: voice-route-codex
    sort: 71
  voice-route-codex-session-id:
    type: fields/string
    title: 'Session ID'
    description: 'Привязка к сессии Codex CLI. Пусто — новая сессия.'
    group: voice-client
    subgroup: voice-route-codex
    sort: 72
  voice-route-codex-permission-mode:
    type: fields/choice/one
    title: 'Подтверждение команд'
    description: 'Как Codex CLI запрашивает подтверждение выполнения команд.'
    default: ''
    enum:
      -
        key: ''
        name: 'Спрашивать (on-request)'
      -
        key: untrusted
        name: Untrusted
      -
        key: bypassPermissions
        name: Never
    group: voice-client
    subgroup: voice-route-codex
    sort: 73
  voice-route-qwenpaw-url:
    type: fields/string
    title: 'URL QwenPaw'
    description: 'Базовый URL API QwenPaw для Voice Shell.'
    default: 'http://127.0.0.1:8088'
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 80
  voice-route-qwenpaw-user-id:
    type: fields/string
    title: 'User ID'
    description: 'Идентификатор пользователя в QwenPaw API.'
    default: default
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 81
  voice-route-qwenpaw-agent-id:
    type: fields/string
    title: 'Agent ID'
    description: 'Идентификатор агента в QwenPaw.'
    default: default
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 82
  voice-route-qwenpaw-approval-level:
    type: fields/choice/one
    title: 'Подтверждение инструментов'
    description: 'OFF — инструменты без окна «Разрешить?»; AUTO — с подтверждением.'
    default: AUTO
    enum:
      -
        key: AUTO
        name: 'Спрашивать (AUTO)'
