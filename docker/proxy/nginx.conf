upstream cms_fpm {
    server cms:9000;
}

# --- CMS: localhost:8080 / :8443 ---
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /dev/null;

    error_page 503 /503-maintenance.html;

    location = /503-maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /mcp/ {
        include /etc/agent-cms/cli/maintenance-check.inc;
        proxy_pass http://mcp:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/hello {
        include /etc/agent-cms/cli/maintenance-check.inc;
        fastcgi_pass cms_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cms/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location /api/ {
        include /etc/agent-cms/cli/maintenance-check.inc;
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /build/ {
        root /var/www/cms/public;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        include /etc/agent-cms/cli/maintenance-check.inc;
        fastcgi_pass cms_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cms/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}

# --- Сервисы: *.localhost (dev), явное имя — до catch-all ниже ---
server {
    listen 80;
    server_name qwenpaw.localhost;

    location / {
        proxy_pass http://qwenpaw:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Неизвестный поддомен *.localhost — не CMS
server {
    listen 80;
    server_name ~^[a-z0-9-]+\.localhost$;
    root /usr/share/nginx/html;
    error_page 404 /404-service.html;

    location / {
        return 404;
    }

    location = /404-service.html {
        internal;
    }
}

# --- CMS HTTPS ---
server {
    listen 443 ssl default_server;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    error_page 503 /503-maintenance.html;

    location = /503-maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /mcp/ {
        include /etc/agent-cms/cli/maintenance-check.inc;
        proxy_pass http://mcp:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/hello {
        include /etc/agent-cms/cli/maintenance-check.inc;
        fastcgi_pass cms_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cms/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }

    location /api/ {
        include /etc/agent-cms/cli/maintenance-check.inc;
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /build/ {
        root /var/www/cms/public;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        include /etc/agent-cms/cli/maintenance-check.inc;
        fastcgi_pass cms_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cms/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }
}

