<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 — техническое обслуживание</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="flex min-h-full flex-col bg-zinc-50 text-zinc-900 antialiased">
    <header class="border-b border-zinc-200 bg-white">
        <div class="mx-auto flex max-w-6xl items-center gap-2 px-4 py-2 sm:px-6">
            <span class="flex h-7 w-7 items-center justify-center rounded-md bg-zinc-900 text-xs font-bold text-white">A</span>
            <span class="text-sm font-semibold tracking-tight text-zinc-900">Agent CMS</span>
        </div>
    </header>

    <main class="mx-auto flex w-full max-w-lg flex-1 flex-col justify-center px-4 py-12 sm:px-6">
        <article class="rounded-lg border border-zinc-200 bg-white p-6 text-center shadow-sm sm:p-8">
            <p class="text-5xl font-bold tabular-nums text-zinc-300">503</p>
            <h1 class="mt-3 text-xl font-semibold tracking-tight text-zinc-900">Техническое обслуживание</h1>
            <p class="mt-2 text-sm leading-relaxed text-zinc-600">
                Платформа временно недоступна. Администратор включает режим через
                <code class="rounded bg-zinc-100 px-1 text-xs">agent-cms-cli-v2 maintenance</code>.
            </p>
            <p class="mt-4 font-mono text-xs text-zinc-500" id="host-line"></p>
        </article>
    </main>

    <footer class="border-t border-zinc-200 bg-white py-3 text-center text-xs text-zinc-500">
        Agent CMS · maintenance
    </footer>
    <script>
        (function () {
            var el = document.getElementById('host-line');
            if (el) {
                el.textContent = window.location.host;
            }
        })();
    </script>
</body>
</html>
