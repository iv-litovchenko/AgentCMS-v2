# Локальная разработка: код с хоста в контейнер без rebuild.
# Скопируйте: cp docker-compose.override.example.yml docker-compose.override.yml
# Compose подхватит override автоматически при `docker compose up`.
# HTTPS без предупреждения браузера: ./scripts/tls-dev-setup.sh (proxy монтирует .dev-certs/ в override)
# CSS (Tailwind): ./scripts/npm-build.sh или cd apps/cms && npm run watch
#
# Монтируется:
#   apps/cms      → /var/www/cms
#   shared/php    → /var/www/shared/php  (autoload AgentCms\Shared)
#   packages      → /var/www/packages    (symlink vendor → ../../../packages/…)
#   /var/www/cms/var — том в контейнере (кэш/логи; bind apps/cms иначе ломает права www-data)
#   ./vaults      → /var/www/vaults (compose base; на Mac при EACCES: chmod ugo+rwx vaults)
# vendor — именованный том (не затирается bind-mount'ом).
#
# Первый запуск / после смены composer.json (в образе vendor без --dev):
#   docker run --rm -v "$PWD/apps/cms:/app" -v "$PWD/shared/php:/shared/php" \
#     -v agent-cms-web_cms_vendor:/app/vendor -w /app composer:2 \
#     composer install --no-interaction

services:
  proxy:
    volumes:
      - ./.dev-certs:/etc/nginx/certs:ro

  cms:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_HOST_PLATFORM: mac
      PROJECT_README_PATH: /var/www/README.md
    volumes:
      - ./apps/cms:/var/www/cms
      - /var/www/cms/var
      - ./shared/php:/var/www/shared/php
      - ./packages:/var/www/packages
      - ./README.md:/var/www/README.md:ro
      - cms_vendor:/var/www/cms/vendor

volumes:
  cms_vendor:
